<script>
(function () {
  var sheet = document.getElementById('sheet'), fit = document.getElementById('fit');
  var btn = document.getElementById('zoom'), hint = document.getElementById('hint');
  var zoomed = false;
  function size() {
    if (zoomed) {
      fit.style.transform = 'none';
      sheet.style.height = '';
      return;
    }
    var s = Math.min(1, sheet.clientWidth / 1040);
    fit.style.transform = 'scale(' + s + ')';
    sheet.style.height = (1160 * s) + 'px';
  }
  btn.addEventListener('click', function () {
    zoomed = !zoomed;
    sheet.classList.toggle('zoomed', zoomed);
    btn.setAttribute('aria-pressed', zoomed);
    btn.textContent = zoomed ? '縮細睇全圖' : '放大睇尺寸';
    hint.hidden = !zoomed;
    size();
    if (zoomed) { sheet.scrollLeft = 120; sheet.scrollTop = 200; }
  });
  window.addEventListener('resize', size);
  size();
})();
</script>
